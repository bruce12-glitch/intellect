version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: intellect-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intellect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intellect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: LocalStack for S3 emulation
  # localstack:
  #   image: localstack/localstack:latest
  #   container_name: intellect-localstack
  #   environment:
  #     SERVICES: s3
  #     DEBUG: 1
  #   ports:
  #     - "4566:4566"
  #   volumes:
  #     - localstack_data:/var/lib/localstack

volumes:
  postgres_data:
  redis_data:
  # localstack_data: