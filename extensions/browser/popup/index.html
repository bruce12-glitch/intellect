<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intellect - Save to Knowledge Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { width: 360px; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900">
  <div id="app">
    <!-- Not logged in state -->
    <div id="login-state" class="hidden p-4">
      <div class="text-center">
        <div class="w-12 h-12 mx-auto mb-4 bg-blue-100 dark:bg-blue-900/30 rounded-xl flex items-center justify-center">
          <svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
        </div>
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-1">Save to Intellect</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Sign in to save content to your knowledge base</p>
        <button id="login-btn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700 transition-colors">
          Sign In
        </button>
        <p class="text-xs text-gray-400 mt-3">Don't have an account? <a href="https://intellect.app/signup" target="_blank" class="text-blue-600 hover:underline">Sign up free</a></p>
      </div>
    </div>

    <!-- Logged in state -->
    <div id="save-state" class="hidden p-4">
      <!-- Page info -->
      <div class="mb-4">
        <div class="flex items-start gap-3 mb-3">
          <div id="favicon" class="w-10 h-10 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center flex-shrink-0">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <p id="page-title" class="font-medium text-gray-900 dark:text-white truncate">Page Title</p>
            <p id="page-url" class="text-xs text-gray-500 dark:text-gray-400 truncate mt-1">https://example.com</p>
          </div>
        </div>
        <div id="selection-info" class="hidden p-2 bg-blue-50 dark:bg-blue-900/20 rounded-lg border border-blue-200 dark:border-blue-800 mb-3">
          <p class="text-xs text-blue-700 dark:text-blue-300">Selected text will be saved as a note</p>
        </div>
      </div>

      <!-- Options -->
      <div class="space-y-3 mb-4">
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="auto-summarize" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" checked>
          <span class="text-sm text-gray-700 dark:text-gray-300">Auto-generate summary</span>
        </label>
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="auto-tag" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" checked>
          <span class="text-sm text-gray-700 dark:text-gray-300">Auto-tag content</span>
        </label>
      </div>

      <!-- Tags input -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Tags (optional)</label>
        <div class="flex gap-2">
          <input type="text" id="tags-input" placeholder="Add tags..." class="flex-1 px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <button id="add-tag" class="px-3 py-2 text-sm bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-lg hover:bg-blue-200 dark:hover:bg-blue-900/50 transition-colors">Add</button>
        </div>
        <div id="tags-list" class="flex flex-wrap gap-1 mt-2"></div>
      </div>

      <!-- Save button -->
      <button id="save-btn" class="w-full bg-blue-600 text-white py-2.5 px-4 rounded-lg font-medium hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
        </svg>
        <span>Save to Intellect</span>
      </button>

      <!-- Status message -->
      <div id="status" class="hidden mt-3 p-3 rounded-lg text-sm"></div>

      <!-- Footer -->
      <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
        <div class="flex items-center justify-between">
          <a href="https://intellect.app" target="_blank" class="text-xs text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400">Open Intellect</a>
          <span class="text-xs text-gray-400">v1.0.0</span>
        </div>
      </div>
    </div>

    <!-- Success state -->
    <div id="success-state" class="hidden p-4 text-center">
      <div class="w-16 h-16 mx-auto mb-4 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center">
        <svg class="w-8 h-8 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h3 class="font-semibold text-gray-900 dark:text-white mb-1">Saved!</h3>
      <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">Content added to your knowledge base</p>
      <button id="open-app" class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700 transition-colors">Open in App</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
